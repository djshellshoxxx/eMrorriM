name: One-time agent skills import
on:
  push:
    paths:
      - '.github/workflows/import-agent-skills-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Copy pinned Superpowers skills without overwriting existing files
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/obra/superpowers.git "$root/superpowers"
          git -C "$root/superpowers" sparse-checkout set skills
          git -C "$root/superpowers" fetch --quiet --depth 1 origin bb92a77741419a4ab5f06e711a283343f1ada0c3
          git -C "$root/superpowers" checkout --quiet --detach FETCH_HEAD
          mkdir -p skills/_third_party_licenses/obra-superpowers
          cp -n "$root/superpowers/LICENSE" skills/_third_party_licenses/obra-superpowers/LICENSE
          for dir in "$root"/superpowers/skills/*/; do
            name="$(basename "$dir")"
            if [[ -e "skills/$name" && ! -d "skills/$name" ]]; then
              echo "SKIPPED file/directory conflict: skills/$name"
              continue
            fi
            mkdir -p "skills/$name"
            cp -a -n "$dir/." "skills/$name/"
          done
          # Audio/JUCE skill imports: source revisions are pinned for reproducibility.
          clone_vendor() {
            local key="$1" repo="$2" revision="$3" sparse="$4"
            git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/$repo.git" "$root/$key"
            git -C "$root/$key" sparse-checkout set $sparse
            git -C "$root/$key" fetch --quiet --depth 1 origin "$revision"
            git -C "$root/$key" checkout --quiet --detach FETCH_HEAD
          }
          copy_license() {
            local key="$1" tag="$2" file
            mkdir -p "skills/_third_party_licenses/$tag"
            for file in LICENSE LICENSE-MIT NOTICE LICENSING.md THIRD_PARTY_NOTICES.md; do
              if [[ -f "$root/$key/$file" ]]; then
                cp -n "$root/$key/$file" "skills/_third_party_licenses/$tag/$file"
              fi
            done
          }
          clone_vendor juce danielraffel/juce-agent-toolkit 9089b719f7378eba28dd078cdfb8b6e1c062bf13 'skills shared'
          cp -a -n "$root/juce/skills/." skills/
          mkdir -p shared
          cp -a -n "$root/juce/shared/." shared/
          copy_license juce danielraffel-juce-agent-toolkit
          clone_vendor anthropic anthropics/skills dbd4588f9e1033efb41dad4bef2f7947c8993d44 skills
          for name in academy-guide algorithmic-art brand-guidelines canvas-design claude-api discernment-nudge frontend-design internal-comms mcp-builder skill-creator slack-gif-creator theme-factory web-artifacts-builder webapp-testing; do
            if [[ -e "skills/$name" && ! -d "skills/$name" ]]; then
              echo "SKIPPED collision: skills/$name"
            else
              mkdir -p "skills/$name"
              cp -a -n "$root/anthropic/skills/$name/." "skills/$name/"
            fi
          done
          copy_license anthropic anthropics-skills
          clone_vendor papers ykdojo/paper-search c8b00fb07aecc98e02f12869ed1c460e5106f162 'skills scripts'
          cp -a -n "$root/papers/skills/." skills/
          mkdir -p skills/paper-search/scripts
          cp -a -n "$root/papers/scripts/." skills/paper-search/scripts/
          copy_license papers ykdojo-paper-search
          clone_vendor caveman JuliusBrussee/caveman d262ab3882952a59312ff3537cd86d894523c5ab skills
          cp -a -n "$root/caveman/skills/." skills/
          copy_license caveman JuliusBrussee-caveman
          clone_vendor tokensaver crichalchemist/token-saver-skill 1e0e0734251864c91e31c17a0696a894c2572ff4 references
          mkdir -p skills/token-saver
          for f in SKILL.md README.md token-saver.skill; do
            if [[ -f "$root/tokensaver/$f" ]]; then cp -n "$root/tokensaver/$f" skills/token-saver/; fi
          done
          if [[ -d "$root/tokensaver/references" ]]; then cp -a -n "$root/tokensaver/references" skills/token-saver/; fi
          clone_vendor efficient drona23/claude-token-efficient 0d30a6db75af983b8ababf585f28faefdfc87895 profiles
          mkdir -p skills/claude-token-efficient
          for f in CLAUDE.md RULES.md README.md LICENSE; do
            if [[ -f "$root/efficient/$f" ]]; then cp -n "$root/efficient/$f" skills/claude-token-efficient/; fi
          done
          if [[ -d "$root/efficient/profiles" ]]; then cp -a -n "$root/efficient/profiles" skills/claude-token-efficient/; fi
          if [[ ! -e skills/claude-token-efficient/SKILL.md ]]; then
            printf '%s\n' '---' 'name: claude-token-efficient' 'description: Apply concise coding response rules and token-saving profiles from drona23/claude-token-efficient.' '---' '' '# Claude Token Efficient' '' 'Read the bundled RULES.md and CLAUDE.md and apply the relevant profile under profiles/ when requested. Preserve project-specific instructions.' > skills/claude-token-efficient/SKILL.md
          fi
          copy_license efficient drona23-claude-token-efficient
          # All copied license files remain with their respective vendors.
          git rm -q -f .github/workflows/import-agent-skills-once.yml
          git add -A skills shared
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor Superpowers and audio/JUCE skills (preserve existing files)'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
